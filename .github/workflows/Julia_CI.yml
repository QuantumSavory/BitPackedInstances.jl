
#==============================================================================#

name: Julia CI

on:
  push:
    branches:
      - main
    tags: ["**"]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - closed
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      feature:
        type: choice
        description: What to run
        options: [DocDeploy, LintAndTest, TagBot]

#==============================================================================#

jobs:
  julia-ci:
    # TODO: Revisit once composite workflows support this.
    # timeout-minutes: 60
    uses: julia-testitems/testitem-workflow/.github/workflows/juliaci.yml@v2
    with:
      # Measured in seconds.
      testitem-timeout: "3600"
      # Match standard library default behaviour.
      check-bounds: "yes"
    permissions: write-all
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

#==============================================================================#
